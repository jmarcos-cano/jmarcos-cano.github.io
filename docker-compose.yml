# Run locally:
#   docker compose up              -> dev server with live reload at http://localhost:4321
#   docker compose --profile site up --build site
#                                  -> the built site, as deployed, at http://localhost:8080

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - ./:/app              # edit files on your computer, the page reloads
      - /app/node_modules    # keep the container's own dependencies
    environment:
      CHOKIDAR_USEPOLLING: "true" # reliable file watching on macOS and Windows mounts

  site:
    profiles: ["site"]
    build:
      context: .
      target: site
    ports:
      - "8080:80"
